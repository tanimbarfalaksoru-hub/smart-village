    function loadLocalData() {

          const parsed = JSON.parse(saved);
          parsed.moduleConfig = {
            ...seed.moduleConfig,
            ...(parsed.moduleConfig || {}),

              ...seed.moduleConfig.branding_official_config,
              ...(parsed.moduleConfig?.branding_official_config || {})

              ...(parsed.moduleConfig?.portal_config || {}),
              visible_menus: {
                ...seed.moduleConfig.portal_config.visible_menus,
                ...(parsed.moduleConfig?.portal_config?.visible_menus || {})
              }
            }
          };
          if (!parsed.village.banner_url) {
            parsed.village.banner_url = seed.village.banner_url;
          }
          if (!Array.isArray(parsed.familyCards)) {
            parsed.familyCards = seed.familyCards;
          }
          if (!Array.isArray(parsed.residents)) {
            parsed.residents = seed.residents;
          }
          if (Array.isArray(parsed.officials)) {
            const hasBpd = parsed.officials.some(o => o.institution === "bpd");
            parsed.officials = parsed.officials.map(o => {
              const seedOff = seed.officials.find(so => so.id === o.id);
              return {
                ...o,
                institution: o.institution || seedOff?.institution || "pemdes",
                level_tier: o.level_tier || seedOff?.level_tier || 3,
                region_rep: o.region_rep || seedOff?.region_rep || "",
                photo_url: o.photo_url !== undefined ? o.photo_url : (seedOff?.photo_url || "")
              };
            });
            if (!hasBpd) {
              parsed.officials.push(...seed.officials.filter(o => o.institution === "bpd"));
            }
          }
          if (Array.isArray(parsed.contents)) {
            parsed.contents = parsed.contents.map(c => {
              const seedItem = seed.contents.find(sc => sc.id === c.id);
              return { ...c, cover_url: c.cover_url !== undefined ? c.cover_url : (seedItem?.cover_url || "") };
            });
          }
          if (Array.isArray(parsed.potentials)) {
            parsed.potentials = parsed.potentials.map(p => {

              return { ...p, image_url: p.image_url !== undefined ? p.image_url : (seedPot?.image_url || "") };
            });
          }
          return parsed;
        }
      } catch (e) {}
      localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(seed));
      return seed;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDateID(dateStr) {
      if (!dateStr) return "-";
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return String(dateStr);
        return d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
      } catch (e) {
        return String(dateStr);
      }
    }

    function calculateAgeYears(birthDateStr) {
      if (!birthDateStr) return 0;
      const dob = new Date(birthDateStr);
      if (isNaN(dob.getTime())) return 0;
      const now = new Date();
      let age = now.getFullYear() - dob.getFullYear();
      const m = now.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) {
        age--;
      }
      return Math.max(0, age);
    }

    function normalizeWhatsAppNumber(phone) {
      let digits = String(phone || "").replace(/\D/g, "");
      if (!digits) return "";
      if (digits.startsWith("0")) {
        digits = "62" + digits.slice(1);
      } else if (digits.startsWith("8")) {
        digits = "62" + digits;
      }
      return digits;
    }

    function extractGoogleDriveFileId(url) {
      const str = String(url || "").trim();
      if (!str) return "";
      const patterns = [
        /\/file\/d\/([a-zA-Z0-9_-]+)/,
        /\/d\/([a-zA-Z0-9_-]+)/,
        /[?&]id=([a-zA-Z0-9_-]+)/
      ];
      for (const regex of patterns) {
        const match = str.match(regex);
        if (match && match[1]) return match[1];
      }
      return "";
    }

    function isValidGoogleDriveUrl(url) {
      const str = String(url || "").trim().toLowerCase();
      if (!str.includes("drive.google.com") && !str.includes("docs.google.com")) return false;
      return Boolean(extractGoogleDriveFileId(url));
    }

    function getGoogleDriveLinks(url) {
      const fileId = extractGoogleDriveFileId(url);
      const isDemo = !fileId || fileId.startsWith("1Demo");
      return {
        fileId,
        isDemo,
        previewUrl: fileId ? `https://drive.google.com/file/d/${fileId}/preview` : url,
        downloadUrl: fileId ? `https://drive.google.com/uc?export=download&id=${fileId}` : url,
        viewUrl: fileId ? `https://drive.google.com/file/d/${fileId}/view` : url
      };
    }

    function resolvePublicImageUrl(url) {
      const raw = String(url || "").trim();
      if (!raw) {
        return { hasImage: false, isGdrive: false, fileId: "", primaryUrl: "", fallbackUrl: "" };
      }
      const isDriveDomain = raw.includes("drive.google.com") || raw.includes("docs.google.com");
      const fileId = isDriveDomain ? extractGoogleDriveFileId(raw) : "";
      if (fileId) {
        return {
          hasImage: true,
          isGdrive: true,
          fileId,
          primaryUrl: `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`,
          fallbackUrl: `https://lh3.googleusercontent.com/d/${fileId}=w1000`
        };
      }
      return {
        hasImage: true,
        isGdrive: false,
        fileId: "",
        primaryUrl: raw,
        fallbackUrl: ""
      };
    }

    function computeDemographicSummary() {
      const { village, familyCards = [], residents = [] } = appState.data;
      const base = village.demographics_json || {};
      const activeResidents = residents.filter(r => r.status === "Aktif" || r.status === "Pendatang");

      const seedResCount = 9;
      const seedKkCount = 3;
      const deltaRes = activeResidents.length - seedResCount;
      const deltaKk = familyCards.length - seedKkCount;

      const maleInDb = activeResidents.filter(r => r.gender === "Laki-laki").length;
      const femaleInDb = activeResidents.filter(r => r.gender === "Perempuan").length;

      const totalPenduduk = Math.max(activeResidents.length, Number(base.total_penduduk || 6420) + deltaRes);
      const totalKk = Math.max(familyCards.length, Number(base.jumlah_kk || 1895) + deltaKk);
      const lakiLaki = Math.max(maleInDb, Number(base.laki_laki || 3240) + (maleInDb - 5));
      const perempuan = Math.max(femaleInDb, totalPenduduk - lakiLaki);

      const ageCounts = { balita: 0, remaja: 0, produktif: 0, lansia: 0 };
      activeResidents.forEach(r => {
        const age = calculateAgeYears(r.birth_date);
        if (age <= 5) ageCounts.balita++;
        else if (age <= 17) ageCounts.remaja++;
        else if (age <= 59) ageCounts.produktif++;
        else ageCounts.lansia++;
      });
      const totalDb = Math.max(1, activeResidents.length);
      const ageGroups = [
        { label: "Balita & Anak (0 – 5 Tahun)", count: Math.round((ageCounts.balita / totalDb) * totalPenduduk), color: "bg-sky-500" },
        { label: "Usia Sekolah (6 – 17 Tahun)", count: Math.round((ageCounts.remaja / totalDb) * totalPenduduk), color: "bg-indigo-500" },
        { label: "Usia Produktif (18 – 59 Tahun)", count: Math.round((ageCounts.produktif / totalDb) * totalPenduduk), color: "bg-emerald-500" },
        { label: "Lanjut Usia (≥ 60 Tahun)", count: Math.round((ageCounts.lansia / totalDb) * totalPenduduk), color: "bg-amber-500" }
      ];

      const eduMap = {};
      activeResidents.forEach(r => {
        const key = r.education || "SLTA / Sederajat";
        eduMap[key] = (eduMap[key] || 0) + 1;
      });
      const educationStats = Object.entries(eduMap)
        .map(([label, raw]) => ({
          label,
          count: Math.max(1, Math.round((raw / totalDb) * totalPenduduk)),
          pct: Math.round((raw / totalDb) * 100)
        }))
        .sort((a, b) => b.count - a.count);

      const jobMap = {};
      activeResidents.forEach(r => {
        const key = r.occupation || "Wiraswasta / UMKM";
        jobMap[key] = (jobMap[key] || 0) + 1;
      });
      const occupationStats = Object.entries(jobMap)
        .map(([label, raw]) => ({
          label,
          count: Math.max(1, Math.round((raw / totalDb) * totalPenduduk)),
          pct: Math.round((raw / totalDb) * 100)
        }))
        .sort((a, b) => b.count - a.count);

      const rwList = ["001", "002", "003", "004", "005", "006", "007", "008"];
      const rwStats = rwList.map((rw, idx) => {
        const kkInRw = familyCards.filter(k => String(k.rw).padStart(3, "0") === rw);
        const resInRw = activeResidents.filter(r => kkInRw.some(k => k.id === r.kk_id));
        const baseWeights = [0.14, 0.13, 0.12, 0.15, 0.11, 0.12, 0.13, 0.10];
        const estTotal = Math.round(totalPenduduk * baseWeights[idx]) + resInRw.length;
        const estKk = Math.round(totalKk * baseWeights[idx]) + kkInRw.length;
        const estMale = Math.round(estTotal * 0.505);
        const estFemale = estTotal - estMale;
        return {
          rw: `RW ${rw}`,
          dusun: idx < 4 ? "Dusun I (Krajan)" : "Dusun II (Puncak Sari)",
          kk: estKk,
          male: estMale,
          female: estFemale,
          total: estTotal
        };
      });

      return {
        totalPenduduk,
        totalKk,
        lakiLaki,
        perempuan,
        malePct: Math.round((lakiLaki / Math.max(1, totalPenduduk)) * 100),
        femalePct: Math.round((perempuan / Math.max(1, totalPenduduk)) * 100),
        jumlahRw: base.jumlah_rw || 8,
        jumlahRt: base.jumlah_rt || 32,
        luasWilayahHa: base.luas_wilayah_ha || 485,
        ageGroups,
        educationStats,
        occupationStats,
        rwStats
      };
    }

    async function syncOfflineQueue() {
      if (!appState.isOnline || appState.offlineQueue.length === 0) return;
      appState.syncStatus = "syncing";
      const remaining = [];
      for (const item of appState.offlineQueue) {
        try {
          if (!IS_PREVIEW && supabase) {
            await supabase.from(item.table).upsert([item.payload]);
          }
        } catch (e) {
          remaining.push(item);
        }
      }
      appState.offlineQueue = remaining;
      saveOfflineQueue(remaining);
      appState.syncStatus = remaining.length === 0 ? "synced" : "error";
      if (remaining.length === 0) {
        showToast("Seluruh draft offline berhasil disinkronkan!", "success");
      }
      renderApp();
    }

      const otpCode = String(Math.floor(100000 + Math.random() * 900000));
      appState.otpChallenge = {

        code: otpCode,
        expiresAt: Date.now() + 10 * 60 * 1000,
        attempts: 0
      };
      if (!IS_PREVIEW && supabase && appState.isOnline) {
        await supabase.auth.signInWithOtp({ email: cleanEmail }).catch(() => {});

      showToast(`Kode OTP 6-digit telah dikirim ke ${cleanEmail}.`, "success");
      renderApp();
    }

    async function verifyCitizenEmailOtp(inputCode) {
      const challenge = appState.otpChallenge;
      if (!challenge) return;
      if (Date.now() > challenge.expiresAt) {
        appState.otpChallenge = null;
        showToast("Kode OTP telah kedaluwarsa. Silakan minta kode baru.", "error");
        renderApp();
        return;
      }
      const cleanCode = String(inputCode || "").trim();
      if (cleanCode !== challenge.code) {
        challenge.attempts += 1;
        showToast("Kode OTP tidak cocok. Periksa kembali 6 digit kode Anda.", "error");
        return;
      }
      appState.verifiedCitizenEmail = challenge.email;
      sessionStorage.setItem(STORAGE_KEY_CITIZEN_OTP, challenge.email);
      appState.otpChallenge = null;
      showToast("Email aktif berhasil terverifikasi OTP! Silakan lanjut mengisi formulir.", "success");
      renderApp();
    }

    function renderTrendLineChartSVG() {
      const points = [
        { label: "Jun", val: 12 },

        { label: "Agu", val: 15 },
        { label: "Sep", val: 24 },
        { label: "Okt", val: 21 },
        { label: "Nov", val: 28 }
      ];
      const w = 400;
      const h = 175;
      const padX = 28;
      const padY = 28;
      const maxVal = 35;

      const coords = points.map((p, idx) => {
        const x = padX + (idx * (w - padX * 2)) / (points.length - 1);
        const y = h - padY - (p.val / maxVal) * (h - padY * 2);
        return { ...p, x, y };
      });

      let pathD = `M ${coords[0].x} ${coords[0].y}`;
      for (let i = 0; i < coords.length - 1; i++) {
        const curr = coords[i];
        const next = coords[i + 1];
        const cpx1 = curr.x + (next.x - curr.x) / 2;
        const cpy1 = curr.y;
        const cpx2 = curr.x + (next.x - curr.x) / 2;
        const cpy2 = next.y;
        pathD += ` C ${cpx1} ${cpy1}, ${cpx2} ${cpy2}, ${next.x} ${next.y}`;
      }
      const areaD = `${pathD} L ${coords[coords.length - 1].x} ${h - padY} L ${coords[0].x} ${h - padY} Z`;
      const activeNode = coords[3];

      return `
        <svg viewBox="0 0 ${w} ${h}" class="w-full h-44 overflow-visible">

            </filter>
          </defs>
          ${[0, 10, 20, 30].map(g => {
            const gy = h - padY - (g / maxVal) * (h - padY * 2);
            return `
              <line x1="${padX}" y1="${gy}" x2="${w - padX}" y2="${gy}" stroke="#F1F3F9" stroke-width="1" />
              <text x="4" y="${gy + 4}" fill="#9CA3AF" font-size="10" font-weight="500">${g}</text>
            `;
          }).join("")}
          <path d="${areaD}" fill="url(#svLavenderArea)" />
          <path d="${pathD}" fill="none" stroke="#6C5CE7" stroke-width="3" stroke-linecap="round" />
          ${coords.map((c, i) => `
            <circle cx="${c.x}" cy="${c.y}" r="${i === 3 ? 5 : 3}" fill="#FFFFFF" stroke="#6C5CE7" stroke-width="${i === 3 ? 3 : 2}" />
            <text x="${c.x}" y="${h - 4}" text-anchor="middle" fill="#9CA3AF" font-size="10" font-weight="600">${c.label}</text>
          `).join("")}
          <g filter="url(#svCalloutShadow)">
            <rect x="${activeNode.x - 32}" y="${activeNode.y - 36}" width="64" height="26" rx="8" fill="#FFFFFF" />

            <text x="${activeNode.x}" y="${activeNode.y - 14}" text-anchor="middle" fill="#9CA3AF" font-size="8" font-weight="600">Aktivitas</text>
          </g>
        </svg>
      `;

    function renderDonutChartSVG() {
      const { contents, serviceRequests, complaints, programs } = appState.data;
      const totalAll = Math.max(1, contents.length + serviceRequests.length + complaints.length + programs.length);
      const p1 = Math.round((contents.length / totalAll) * 100);
      const p2 = Math.round((serviceRequests.length / totalAll) * 100);
      const p3 = Math.round((complaints.length / totalAll) * 100);
      const p4 = Math.max(0, 100 - (p1 + p2 + p3));

      const segments = [
        { label: "Konten Publik", count: contents.length, pct: p1, color: "#F48FB1" },
        { label: "Layanan Warga", count: serviceRequests.length, pct: p2, color: "#FCD34D" },
        { label: "Pengaduan", count: complaints.length, pct: p3, color: "#6EE7B7" },
        { label: "Pembangunan", count: programs.length, pct: p4, color: "#A78BFA" }
      ];
      const radius = 42;
      const circumference = 2 * Math.PI * radius;
      let accumulatedPct = 0;

      const circles = segments.map(seg => {
        const strokeDasharray = `${(seg.pct / 100) * circumference} ${circumference}`;
        const strokeDashoffset = -((accumulatedPct / 100) * circumference);
        accumulatedPct += seg.pct;
        return `
          <circle
            cx="64" cy="64" r="${radius}"
            fill="transparent"
            stroke="${seg.color}"
            stroke-width="18"
            stroke-dasharray="${strokeDasharray}"
            stroke-dashoffset="${strokeDashoffset}"
            transform="rotate(-90 64 64)"
          />
        `;
      }).join("");

      return `
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
          <div class="relative w-32 h-32 shrink-0 flex items-center justify-center">
            <svg viewBox="0 0 128 128" class="w-full h-full drop-shadow-sm">

              <span class="text-[10px] font-semibold text-slate-400">Total Data</span>
              <span class="text-base font-extrabold text-slate-900">${totalAll}</span>
            </div>
          </div>
          <div class="flex-1 w-full space-y-2.5">
            ${segments.map(s => `
              <div class="flex items-center justify-between text-xs">
                <div class="flex items-center gap-2">
                  <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${s.color}"></span>
                  <span class="font-semibold text-slate-600">${s.label}</span>
                </div>
                <span class="font-bold text-slate-800">${s.count} <span class="text-slate-400 font-medium">(${s.pct}%)</span></span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

      const normalized = normalizeWhatsAppNumber(phone);

    }

    function processUploadedImage(file, maxWidth = 600) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error("File tidak ditemukan"));
        if (!file.type.startsWith("image/")) {
          return reject(new Error("Format file harus berupa gambar (PNG/JPG/WEBP)."));
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
            canvas.width = Math.round(img.width * ratio);
            canvas.height = Math.round(img.height * ratio);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/png", 0.9));
          };
          img.onerror = () => reject(new Error("Gagal memproses gambar."));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error("Gagal membaca file."));
        reader.readAsDataURL(file);
      });
    }

      if (tab === "penduduk") {
        const { familyCards = [], residents = [] } = appState.data;
        const stats = computeDemographicSummary();
        const q = String(appState.residentSearch || "").trim().toLowerCase();
        const rwFilter = appState.residentRwFilter || "semua";

        const rwOptions = ["semua", ...Array.from(new Set(familyCards.map(k => String(k.rw).padStart(3, "0")))).sort()];

        const filteredKks = familyCards.filter(kk => {
          const matchRw = rwFilter === "semua" || String(kk.rw).padStart(3, "0") === rwFilter;
          if (!matchRw) return false;
          if (!q) return true;
          const members = residents.filter(r => r.kk_id === kk.id);
          return (
            kk.kk_number.toLowerCase().includes(q) ||
            kk.head_of_family.toLowerCase().includes(q) ||
            kk.dusun.toLowerCase().includes(q) ||
            members.some(m => m.full_name.toLowerCase().includes(q) || m.nik.toLowerCase().includes(q))
          );
        });

        return `

            <div class="soft-card rounded-3xl p-6 flex flex-col lg:flex-row lg:items-center justify-between gap-4 border border-indigo-100/70 bg-gradient-to-r from-white via-[#F9FAFC] to-[#F3F1FF]/50">

      if (!imgEl || !statusEl) return;

      if (!rawVal) {
        imgEl.dataset.fallback = "";
        imgEl.src = getPlaceholderImageByTag("PRATINJAU");
        statusEl.className = "text-[11px] font-bold text-slate-500";
        statusEl.textContent = "Belum ada URL gambar yang dimasukkan (Opsional)";
        return;
      }

      const resolved = resolvePublicImageUrl(rawVal);
      statusEl.className = "text-[11px] font-bold text-blue-600";
      statusEl.textContent = resolved.isGdrive
        ? `Memuat gambar Google Drive (ID: ${resolved.fileId.slice(0, 10)}...)`
        : "Memuat pratinjau gambar...";
      imgEl.dataset.fallback = resolved.fallbackUrl || "";
      imgEl.dataset.triedFallback = "false";
      imgEl.src = resolved.primaryUrl;
    };

      statusEl.className = "text-[11px] font-bold text-emerald-700";

    window.svOnGdrivePreviewError = (imgEl, statusId) => {

      const fallback = imgEl.dataset.fallback;
      if (fallback && imgEl.dataset.triedFallback !== "true" && imgEl.src !== fallback) {
        imgEl.dataset.triedFallback = "true";
        imgEl.src = fallback;

    window.svChangeContentStatus = async (id, newStatus, note = "") => {
      const idx = appState.data.contents.findIndex(c => c.id === id);
      if (idx === -1) return;

      const executeChange = async () => {
        const item = appState.data.contents[idx];
        item.status = newStatus;
        if (note) item.review_note = note;
        if (newStatus === "Published") {
          item.approved_by = appState.currentUser?.name || "Pimpinan Desa";
          item.published_at = new Date().toISOString();
        }
        saveLocalData(appState.data);

        if (!IS_PREVIEW && supabase && appState.isOnline) {
          await supabase.from('content_items').update({
            status: item.status,
            review_note: item.review_note,
            approved_by: item.approved_by,
            published_at: item.published_at
          }).eq('id', id);
        }

        await recordAuditLog("CHANGE_CONTENT_STATUS", "content_items", id, `Status diubah menjadi ${newStatus}`);
        showToast(`Status konten berhasil diperbarui ke "${newStatus}".`, "success");
        renderApp();
      };

      if (newStatus === "Published") {
        openConfirmDialog({
          title: "Setujui & Publikasikan ke Portal Publik?",
          message: "Pastikan konten tidak memuat data pribadi (NIK/KK) dan foto telah memiliki izin publikasi.",
          confirmText: "Ya, Publikasikan",
          onConfirm: executeChange
        });
      } else {
        await executeChange();
      }
    };

      const headers = ["no_kk", "nik", "nama_lengkap", "jenis_kelamin", "tempat_lahir", "tanggal_lahir", "agama", "pendidikan", "pekerjaan", "status_perkawinan", "shdk", "status_penduduk"];

        headers.join(","),
        ...residents.map(r => {
          const kk = familyCards.find(k => k.id === r.kk_id);
          const row = [kk?.kk_number || "", r.nik, r.full_name, r.gender, r.birth_place, r.birth_date, r.religion, r.education, r.occupation, r.marital_status, r.family_role, r.status];

        })
      ].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `DATA_PENDUDUK_DESA_${new Date().toISOString().slice(0, 10)}.csv`;

          saveLocalData(appState.data);
          await saveModuleConfigToSupabase();
          await recordAuditLog("RESET_CONFIG", "village_module_configs", appState.data.village.id, "Mereset konfigurasi semua modul ke default");
          showToast("Konfigurasi berhasil dikembalikan ke pengaturan standar.", "success");
          renderApp();
        }
      });
    };

    async function saveModuleConfigToSupabase() {
      const cfg = appState.data.moduleConfig;
      cfg.updated_by = appState.currentUser?.name || "Super Admin Desa";
      cfg.updated_at = new Date().toISOString();
      saveLocalData(appState.data);
      if (!IS_PREVIEW && supabase && appState.isOnline) {
        await supabase.from('village_module_configs').upsert([cfg], { onConflict: 'village_id' });
      }
    }

    // =========================================================================
    // 15. DELEGASI EVENT FORM SUBMIT GLOBAL
    // =========================================================================
    document.addEventListener("submit", async (e) => {
      const form = e.target;

      if (form.id === "sv-citizen-otp-request-form") {
        e.preventDefault();
        const fd = new FormData(form);
        await requestCitizenEmailOtp(fd.get("citizen_email"));
      }

      if (form.id === "sv-citizen-otp-verify-form") {
        e.preventDefault();
        const fd = new FormData(form);
        await verifyCitizenEmailOtp(fd.get("otp_code"));
      }

      if (form.id === "sv-form-login-admin") {
        e.preventDefault();
        const email = document.getElementById("login-admin-email").value;
        const pass = document.getElementById("login-admin-pass").value;
        await handleAdminLogin(email, pass);
      }

      if (form.id === "sv-form-login-operator") {
        e.preventDefault();
        const user = document.getElementById("login-op-username").value;
        const pass = document.getElementById("login-op-pass").value;
        await handleOperatorLogin(user, pass);
      }

      if (form.id === "sv-public-service-form") {
        e.preventDefault();
        if (!appState.verifiedCitizenEmail) {
          showToast("Silakan verifikasi email aktif Anda via kode OTP terlebih dahulu.", "error");
          return;
        }
        const fd = new FormData(form);
        const gdriveUrl = String(fd.get("gdrive_pdf_url") || "").trim();
        if (!isValidGoogleDriveUrl(gdriveUrl)) {
          showToast("Masukkan tautan file Google Drive yang valid (mengandung File ID).", "error");
          return;
        }
        if (!fd.get("confirm_gdrive_shared")) {
          showToast("Centang pernyataan bahwa file PDF tetap Restricted dan sudah dibagikan ke email desa.", "error");
          return;
        }
        const waNormalized = normalizeWhatsAppNumber(fd.get("applicant_whatsapp"));
        if (waNormalized.length < 10) {
          showToast("Masukkan nomor WhatsApp aktif yang valid.", "error");
          return;
        }

        const srvType = appState.data.serviceTypes.find(s => s.id === fd.get("service_type_id"));
        const prefix = appState.data.moduleConfig.service_config.ticket_prefix || "LYN-2026";
        const ticket = `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`;
        const villageName = appState.data.village.name;
        const receiverEmail = getGdriveReceiverEmail();

        const newReq = {
          id: "req-" + Date.now(),
          village_id: appState.data.village.id,
          service_type_id: srvType?.id || "srv-01",
          service_name: srvType?.name || "Layanan Desa",
          ticket_number: ticket,
          applicant_name: fd.get("applicant_name"),
          applicant_email: appState.verifiedCitizenEmail,
          applicant_whatsapp: waNormalized,
          applicant_contact: waNormalized,
          gdrive_pdf_url: gdriveUrl,
          purpose: fd.get("purpose"),
          notes: fd.get("notes"),
          status: "Diterima",
          officer_note: `Permohonan diterima sistem. Berkas PDF Restricted (dibagikan ke ${receiverEmail}) siap diperiksa petugas.`,
          created_at: new Date().toISOString()
        };

        const waMessage = `Halo Admin Pelayanan *${villageName}*, saya telah mengajukan permohonan layanan melalui Portal SMART VILLAGE:\n\n• No. Tiket: *${ticket}*\n• Layanan: ${newReq.service_name}\n• Nama Pemohon: ${newReq.applicant_name}\n• Email (Terverifikasi): ${newReq.applicant_email}\n• No. WhatsApp: ${waNormalized}\n• Keperluan: ${newReq.purpose}\n• Berkas PDF GDrive (Shared ke ${receiverEmail}): ${gdriveUrl}\n\nMohon untuk dapat ditindaklanjuti. Terima kasih.`;

        appState.data.serviceRequests.unshift(newReq);
        appState.lastGeneratedTicket = { type: "service", ticket, waMessage };
        saveLocalData(appState.data);

        if (!IS_PREVIEW && supabase && appState.isOnline) {
          const { service_name, ...dbPayload } = newReq;
          await supabase.from('service_requests').insert([dbPayload]);
        }
        await recordAuditLog("SUBMIT_SERVICE_PUBLIC", "service_requests", ticket, `Pengajuan layanan baru (${newReq.service_name}) oleh ${newReq.applicant_email}`);
        showToast(`Permohonan terkirim! Nomor Tiket: ${ticket}`, "success");
        renderApp();
      }

      if (form.id === "sv-public-complaint-form") {
        e.preventDefault();
        if (!appState.verifiedCitizenEmail) {
          showToast("Silakan verifikasi email aktif Anda via kode OTP terlebih dahulu.", "error");
          return;
        }
        const fd = new FormData(form);
        const gdriveUrl = String(fd.get("gdrive_pdf_url") || "").trim();
        if (gdriveUrl && !isValidGoogleDriveUrl(gdriveUrl)) {
          showToast("Format tautan lampiran harus berasal dari file Google Drive yang valid.", "error");
          return;
        }
        if (gdriveUrl && !fd.get("confirm_gdrive_shared")) {
          showToast("Centang konfirmasi bahwa bukti PDF GDrive sudah dibagikan ke email desa.", "error");
          return;
        }
        const waNormalized = normalizeWhatsAppNumber(fd.get("reporter_whatsapp"));
        if (waNormalized.length < 10) {
          showToast("Masukkan nomor WhatsApp aktif yang valid.", "error");
          return;
        }

        const prefix = appState.data.moduleConfig.complaint_config.ticket_prefix || "ADU-2026";
        const ticket = `${prefix}-${Math.floor(100 + Math.random() * 900)}`;
        const villageName = appState.data.village.name;
        const receiverEmail = getGdriveReceiverEmail();

        const newCmp = {
          id: "cmp-" + Date.now(),
          village_id: appState.data.village.id,
          ticket_number: ticket,
          category: fd.get("category"),
          title: fd.get("title"),
          description: fd.get("description"),
          location_text: fd.get("location_text"),
          reporter_name: String(fd.get("reporter_name") || "").trim() || "Warga (Anonim)",
          reporter_email: appState.verifiedCitizenEmail,
          reporter_whatsapp: waNormalized,
          reporter_contact: waNormalized,
          gdrive_pdf_url: gdriveUrl,
          priority: "Sedang",
          status: "Diterima",
          assigned_to: "Belum ditugaskan",
          resolution_note: "Laporan telah diterima dan masuk antrean peninjauan petugas.",
          created_at: new Date().toISOString()
        };

        const waMessage = `Halo Admin Pengaduan *${villageName}*, saya menyampaikan aspirasi/pengaduan melalui Portal SMART VILLAGE:\n\n• No. Tiket: *${ticket}*\n• Kategori: ${newCmp.category}\n• Judul: *${newCmp.title}*\n• Lokasi: ${newCmp.location_text}\n• Pelapor: ${newCmp.reporter_name}\n• Email (Terverifikasi): ${newCmp.reporter_email}\n• No. WhatsApp: ${waNormalized}${gdriveUrl ? `\n• Dokumen PDF GDrive (Shared ke ${receiverEmail}): ${gdriveUrl}` : ''}\n\nMohon untuk dapat ditindaklanjuti. Terima kasih.`;

        appState.data.complaints.unshift(newCmp);
        appState.lastGeneratedTicket = { type: "complaint", ticket, waMessage };
        saveLocalData(appState.data);

        if (!IS_PREVIEW && supabase && appState.isOnline) {
          await supabase.from('complaints').insert([newCmp]);
        }
        await recordAuditLog("SUBMIT_COMPLAINT_PUBLIC", "complaints", ticket, `Pengaduan baru kategori ${newCmp.category} oleh ${newCmp.reporter_email}`);
        showToast(`Pengaduan tercatat! Nomor Tiket: ${ticket}`, "success");
        renderApp();
      }

      if (form.id === "sv-admin-profile-form") {
        e.preventDefault();
        const fd = new FormData(form);
        const v = appState.data.village;
        v.name = fd.get("name");
        v.code = fd.get("code");
        v.phone = fd.get("phone");
        v.address = fd.get("address");
        v.banner_url = String(fd.get("banner_url") || "").trim();
        v.history = fd.get("history");
        v.vision_mission = fd.get("vision_mission");
        v.demographics_json = {
          ...v.demographics_json,
          total_penduduk: Number(fd.get("total_penduduk")),
          jumlah_kk: Number(fd.get("jumlah_kk")),
          laki_laki: Number(fd.get("laki_laki")),
          perempuan: Number(fd.get("perempuan"))
        };
        saveLocalData(appState.data);
        if (!IS_PREVIEW && supabase && appState.isOnline) {
          await supabase.from('villages').update(v).eq('id', v.id);
        }
        await recordAuditLog("UPDATE_VILLAGE_PROFILE", "villages", v.id, "Memperbarui profil umum, foto panorama desa dan statistik agregat");
        showToast("Profil & foto desa berhasil diperbarui.", "success");
        renderApp();
      }

      if (form.id === "sv-content-editor-form") {
        e.preventDefault();
        const fd = new FormData(form);
        const id = fd.get("id");
        const payload = {
          id: id || "cnt-" + Date.now(),
          village_id: appState.data.village.id,
          category: fd.get("category"),
          title: fd.get("title"),
          summary: fd.get("summary"),
          body: fd.get("body"),
          cover_url: String(fd.get("cover_url") || "").trim(),
          event_date: fd.get("event_date"),
          status: "Draft",
          review_note: "",
          author_name: appState.currentUser?.name || "Operator Desa",
          approved_by: "",
          published_at: null
        };

        if (id) {
          const idx = appState.data.contents.findIndex(c => c.id === id);
          if (idx !== -1) appState.data.contents[idx] = { ...appState.data.contents[idx], ...payload };
        } else {
          appState.data.contents.unshift(payload);
        }
        saveLocalData(appState.data);

        if (!appState.isOnline) {
          appState.offlineQueue.push({
            table: "content_items",
            payload,
            timestamp: new Date().toISOString()
          });
          saveOfflineQueue(appState.offlineQueue);
          appState.syncStatus = "pending";
          closeModal();
          showToast("Tersimpan sebagai draft offline. Akan disinkronkan saat koneksi kembali online.", "warning");
          renderApp();
          return;
        }

        if (!IS_PREVIEW && supabase) {
          await supabase.from('content_items').upsert([payload]);
        }
        await recordAuditLog("SAVE_CONTENT_DRAFT", "content_items", payload.id, `Menyimpan draft konten: ${payload.title}`);
        closeModal();
        showToast("Konten berhasil disimpan sebagai Draft.", "success");
        renderApp();
      }

      if (form.id === "sv-cfg-form-branding") {
        e.preventDefault();
        const fd = new FormData(form);
        const b = appState.data.moduleConfig.branding_official_config;
        b.app_logo_url = String(fd.get("app_logo_url") || "").trim();
        b.letterhead_logo_url = String(fd.get("letterhead_logo_url") || "").trim();
        b.kades_signature_stamp_url = String(fd.get("kades_signature_stamp_url") || "").trim();
        b.kades_name = String(fd.get("kades_name") || "").trim();
        b.kades_title = String(fd.get("kades_title") || "").trim();
        b.kades_nip = String(fd.get("kades_nip") || "").trim();
        b.gdrive_receiver_email = String(fd.get("gdrive_receiver_email") || "").trim().toLowerCase() || "pelayanan.desasukamaju@gmail.com";
        b.whatsapp_center_number = normalizeWhatsAppNumber(fd.get("whatsapp_center_number")) || "6281288002026";
        await saveModuleConfigToSupabase();
        await recordAuditLog("UPDATE_CONFIG_BRANDING", "village_module_configs", "branding_official_config", "Memperbarui logo aplikasi, logo kop surat, scan TTD Kades bercap, email GDrive & WA center");
        showToast("Konfigurasi Logo, Kop Surat, Email GDrive & Scan TTD berhasil disimpan!", "success");
        renderApp();
      }

      if (form.id === "sv-cfg-form-portal") {
        e.preventDefault();
        const fd = new FormData(form);
        const p = appState.data.moduleConfig.portal_config;
        p.portal_slug = fd.get("portal_slug");
        p.portal_status = fd.get("portal_status");
        p.hero_tagline = fd.get("hero_tagline");
        p.office_hours = fd.get("office_hours");
        ["beranda", "profil", "informasi", "data_kependudukan", "pembangunan", "potensi_wisata", "pelayanan", "pengaduan", "kontak"].forEach(k => {
          p.visible_menus[k] = Boolean(fd.get("menu_" + k));
        });
        await saveModuleConfigToSupabase();
        await recordAuditLog("UPDATE_CONFIG_PORTAL", "village_module_configs", "portal_config", "Memperbarui konfigurasi tampilan & visibilitas menu portal publik");
        showToast("Konfigurasi Portal Publik berhasil disimpan!", "success");
        renderApp();
      }

      if (form.id === "sv-cfg-form-workflow") {
        e.preventDefault();
        const fd = new FormData(form);
        const w = appState.data.moduleConfig.workflow_config;
        w.approval_mode = fd.get("approval_mode");
        w.max_attachment_mb = Number(fd.get("max_attachment_mb"));
        w.require_revision_note = Boolean(fd.get("require_revision_note"));
        w.auto_archive_expired = Boolean(fd.get("auto_archive_expired"));
        await saveModuleConfigToSupabase();
        await recordAuditLog("UPDATE_CONFIG_WORKFLOW", "village_module_configs", "workflow_config", "Memperbarui kebijakan alur persetujuan konten");
        showToast("Konfigurasi Workflow Konten berhasil disimpan!", "success");
        renderApp();
      }

      if (form.id === "sv-cfg-form-service") {
        e.preventDefault();
        const fd = new FormData(form);
        const s = appState.data.moduleConfig.service_config;
        const b = appState.data.moduleConfig.branding_official_config;
        s.online_submission_enabled = Boolean(fd.get("online_submission_enabled"));
        s.ticket_prefix = String(fd.get("ticket_prefix")).toUpperCase();
        s.default_sla_days = Number(fd.get("default_sla_days"));
        s.receipt_instruction = fd.get("receipt_instruction");
        const gdriveMail = String(fd.get("gdrive_receiver_email") || "").trim().toLowerCase();
        if (gdriveMail) b.gdrive_receiver_email = gdriveMail;
        await saveModuleConfigToSupabase();
        await recordAuditLog("UPDATE_CONFIG_SERVICE", "village_module_configs", "service_config", "Memperbarui pengaturan pelayanan publik, tiket & email GDrive");
        showToast("Konfigurasi Pelayanan Publik berhasil disimpan!", "success");
        renderApp();
      }

      if (form.id === "sv-cfg-form-complaint") {
        e.preventDefault();
        const fd = new FormData(form);
        const c = appState.data.moduleConfig.complaint_config;
        c.ticket_prefix = String(fd.get("ticket_prefix")).toUpperCase();
        c.allow_anonymous = Boolean(fd.get("allow_anonymous"));
        c.public_ticket_tracking = Boolean(fd.get("public_ticket_tracking"));
        c.privacy_notice = fd.get("privacy_notice");
        await saveModuleConfigToSupabase();
        await recordAuditLog("UPDATE_CONFIG_COMPLAINT", "village_module_configs", "complaint_config", "Memperbarui pengaturan pengaduan & pemberitahuan privasi");
        showToast("Konfigurasi Pengaduan & Privasi berhasil disimpan!", "success");
        renderApp();
      }

      if (form.id === "sv-cfg-form-data-gis") {
        e.preventDefault();
        const fd = new FormData(form);
        const g = appState.data.moduleConfig.data_gis_config;
        g.min_demographic_threshold = Number(fd.get("min_demographic_threshold"));
        g.map_center_lat = Number(fd.get("map_center_lat"));
        g.map_center_lng = Number(fd.get("map_center_lng"));
        g.show_budget_summary_public = Boolean(fd.get("show_budget_summary_public"));
        g.show_asset_details_public = Boolean(fd.get("show_asset_details_public"));
        await saveModuleConfigToSupabase();
        await recordAuditLog("UPDATE_CONFIG_GIS", "village_module_configs", "data_gis_config", "Memperbarui pengaturan statistik agregat & koordinat peta GIS");
        showToast("Konfigurasi Data & GIS berhasil disimpan!", "success");
        renderApp();
      }
    });

    // =========================================================================
    // 16. RENDER ENGINE UTAMA & INISIALISASI
    // =========================================================================
    function renderApp() {
      const root = document.getElementById("smart-village-root");
      if (!root) return;

      if (appState.viewArea === "login") {
        root.innerHTML = renderLoginView();
      } else if (appState.viewArea === "admin" && appState.currentUser) {
        root.innerHTML = renderAdminDashboard();
      } else {
        root.innerHTML = renderPublicPortal();
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    (async function initSmartVillage() {
      renderApp();
      await autoSetupDatabase();
      if (appState.isOnline && appState.offlineQueue.length > 0) {
        await syncOfflineQueue();
      }
    })();
  </script>
</body>
</html>
